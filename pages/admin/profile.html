<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile | Exatopia</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        .profile-container { max-width: 900px; margin: 0 auto; padding: 2.25rem 1.75rem; width: 100%; }
        .profile-card {
            background: linear-gradient(145deg, var(--bg-card) 0%, rgba(30,16,8,0.95) 100%);
            border: 1px solid var(--border-md);
            border-radius: var(--radius-xl);
            padding: 2.25rem;
            margin-bottom: 1.75rem;
            box-shadow: var(--shadow-md), var(--shadow-glow);
            position: relative; overflow: hidden;
        }
        .profile-card::before {
            content: "";
            position: absolute; top:0; left:0; right:0; height:3px;
            background: linear-gradient(90deg, var(--brown-600), var(--brown-300), var(--brown-400));
        }
        .info-item label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
        .info-item p { font-size: 0.95rem; color: var(--text-heading); }
        .role-badge {
            display: inline-flex; align-items: center;
            background: rgba(160,98,42,0.15); color: var(--brown-300); border: 1px solid rgba(200,133,74,0.3);
            padding: 0.2rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <a href="../../index.html" class="logo" style="text-decoration:none;"><span class="logo-e">E</span>Xatopia</a>
        <button id="menuToggle" class="menu-toggle" aria-label="Menu">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="../../index.html">Home</a>
            <a href="../../pages/student/profile.html">Examinee Profile</a>
            <a href="../../pages/teacher/profile.html">Examiner Profile</a>
            <a href="../../pages/student/dashboard.html">Dashboard</a>
            <a href="../../pages/student/exams.html">Exams</a>
            <a href="../../pages/teacher/create-exam.html">Set Exam</a>
            <a href="../../pages/student/viva.html">Viva</a>
            <a href="../../pages/admin/dashboard.html">Dashboard</a>
            <a href="../../pages/login.html">Sign In</a>
            <a href="../../pages/register.html">Sign Up</a>
            <button id="logoutBtn" class="btn" style="background:#dc2626; color:white; border:none; cursor:pointer; margin-left:1rem;">Logout</button>
        </div>
    </nav>

    <main class="profile-container">
        <div class="profile-card">
            <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.25rem;">
                <h2 id="profileName">Loading...</h2>
                <span class="role-badge">Admin</span>
            </div>
            <div class="info-item" style="margin-bottom:1rem;">
                <label>Email</label>
                <p id="profileEmail">—</p>
            </div>
            <div class="info-item" style="margin-bottom:1rem;">
                <label>Institution</label>
                <p id="profileInstitution">—</p>
            </div>
            <div class="info-item">
                <label>Role</label>
                <p id="profileRole">admin</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { protectRoute } from "../../js/guard.js";
        import { auth } from "../../js/firebase-config.js";
        import { logoutUser, getUserProfile } from "../../js/auth.js";

        protectRoute(["admin"]);

        auth.onAuthStateChanged(async (user) => {
            if (!user) return;
            try {
                const profile = await getUserProfile(user.uid);
                document.getElementById("profileName").textContent = profile?.name || user.displayName || user.email;
                document.getElementById("profileEmail").textContent = user.email;
                document.getElementById("profileInstitution").textContent = profile?.institution || "Not specified";
                document.getElementById("profileRole").textContent = profile?.role || "admin";
            } catch (e) {
                document.getElementById("profileName").textContent = user.email;
                document.getElementById("profileEmail").textContent = user.email;
            }
        });
    </script>
    <script type="module" src="../../js/nav.js"></script>

    <footer class="site-footer">&copy; 2026 Exatopia Team. All rights reserved.</footer>
</body>
</html>
