<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results &amp; Proctored Log | Exatopia</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; background: var(--bg-card); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        th, td { padding: 0.85rem 1rem; text-align: left; border-bottom: 1px solid var(--border); color: var(--text-main); font-size: 0.9rem; }
        th { background: var(--bg-inset); color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; border-bottom: 1px solid var(--border-md); }
        .badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.8rem; font-weight: bold; }
        .badge-clean { background: rgba(21,128,61,0.2); color: #34d399; border: 1px solid rgba(52,211,153,0.3); }
        .badge-flagged { background: rgba(185,28,28,0.2); color: #fca5a5; border: 1px solid rgba(252,165,165,0.3); }
        .grade-pill { display: inline-block; padding: 0.2rem 0.65rem; border-radius: 999px; font-size: 0.8rem; font-weight: bold; }
        .marks-display { font-size: 1rem; font-weight: 700; color: var(--brown-200); }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <a href="../../index.html" class="logo" style="text-decoration:none;"><span class="logo-e">E</span>Xatopia</a>
        <button id="menuToggle" class="menu-toggle" aria-label="Menu">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="../../index.html">Home</a>
            <a href="../../pages/student/profile.html">Examinee Profile</a>
            <a href="../../pages/teacher/profile.html">Examiner Profile</a>
            <a href="../../pages/student/dashboard.html">Dashboard</a>
            <a href="../../pages/student/exams.html">Exams</a>
            <a href="../../pages/teacher/create-exam.html">Set Exam</a>
            <a href="../../pages/student/viva.html">Viva</a>
            <a href="../../pages/admin/dashboard.html">Dashboard</a>
            <a href="../../pages/login.html">Sign In</a>
            <a href="../../pages/register.html">Register</a>
            <button id="logoutBtn" class="btn" style="background:#dc2626; color:white; border:none; cursor:pointer; margin-left:1rem;">Logout</button>
        </div>
    </nav>

    <main style="padding: 2rem; max-width: 720px; margin: 0 auto;">
        <h2>Exam Submissions & Cheat Violations</h2>
        <div id="summaryRow" style="display:flex;gap:1rem;margin-top:1.25rem;flex-wrap:wrap;"></div>
        
        <table>
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Marks Obtained</th>
                    <th>Grade</th>
                    <th>Submitted At</th>
                    <th>Violation</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody">
                <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading attempts...</td></tr>
            </tbody>
        </table>
    </main>

    <script type="module">
        import { protectRoute } from "../../js/guard.js";
        import { db, auth } from "../../js/firebase-config.js";
        import { getGrade } from "../../js/ui-utils.js";
        import { expelStudentAttempt } from "../../js/exam.js";
        import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        protectRoute(["teacher"]);

        window.expelStudent = async (attemptId, studentLabel) => {
            if (!confirm(`Expel ${studentLabel}? This removes their attempt, score and violation records from this exam.`)) return;
            try {
                await expelStudentAttempt(attemptId);
                alert(`${studentLabel} has been expelled and their submission removed.`);
                loadResults();
            } catch (err) {
                alert("Error expelling student: " + err.message);
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get("examId");

        async function loadResults() {
            const tableBody = document.getElementById("resultsTableBody");
            const summaryRow = document.getElementById("summaryRow");

            try {
                const q = query(collection(db, "attempts"), where("examId", "==", examId));
                const snapshot = await getDocs(q);

                
                let examMaxViolations = 0;
                try {
                    const examSnap = await getDoc(doc(db, "exams", examId));
                    if (examSnap.exists()) examMaxViolations = parseInt(examSnap.data().maxViolations) || 0;
                } catch (e) {}

                if (snapshot.empty) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center;">No attempts recorded for this exam yet.</td></tr>`;
                    return;
                }

                const attempts = [];
                snapshot.forEach((doc) => {
                    const d = doc.data();
                    d.maxViolations = d.maxViolations || examMaxViolations || 0;
                    attempts.push({ id: doc.id, ...d });
                });

                
                const graded = attempts.filter(a => a.total > 0);
                const avgPct = graded.length > 0
                    ? Math.round(graded.reduce((s, a) => s + Math.round((a.score / a.total) * 100), 0) / graded.length)
                    : 0;
                const avgGrade = getGrade(avgPct);

                summaryRow.innerHTML = `
                    <div style="background:var(--bg-card);border:1px solid var(--border-md);border-radius:var(--radius-lg);padding:1rem 1.5rem;text-align:center;min-width:120px;">
                        <div style="font-size:1.5rem;font-weight:bold;color:var(--brown-200);">${attempts.length}</div>
                        <div style="font-size:0.78rem;color:var(--text-muted);margin-top:0.2rem;text-transform:uppercase;letter-spacing:0.04em;font-weight:600;">Total Submissions</div>
                    </div>
                    <div style="background:var(--bg-card);border:1px solid var(--border-md);border-radius:var(--radius-lg);padding:1rem 1.5rem;text-align:center;min-width:120px;">
                        <div style="font-size:1.5rem;font-weight:bold;color:var(--accent);">${avgPct}%</div>
                        <div style="font-size:0.78rem;color:var(--text-muted);margin-top:0.2rem;text-transform:uppercase;letter-spacing:0.04em;font-weight:600;">Class Average</div>
                    </div>
                    <div style="background:${avgGrade.bg};border:1px solid ${avgGrade.color};border-radius:var(--radius-lg);padding:1rem 1.5rem;text-align:center;min-width:120px;">
                        <div style="font-size:1.5rem;font-weight:bold;color:${avgGrade.color};">${avgGrade.grade}</div>
                        <div style="font-size:0.78rem;color:var(--text-muted);margin-top:0.2rem;text-transform:uppercase;letter-spacing:0.04em;font-weight:600;">Class Avg Grade</div>
                    </div>
                `;

                let html = "";
                attempts.forEach((data) => {
                    const isFlagged = data.autoSubmitted || data.violationCount > 0;
                    const score = parseInt(data.score ?? 0);
                    const total = parseInt(data.total ?? 0);
                    const pct = total > 0 ? Math.round((score / total) * 100) : (data.percentage ?? null);
                    const gradeInfo = pct !== null ? getGrade(pct) : null;

                    const marksHtml = total > 0
                        ? `<span class="marks-display">${score} / ${total}</span> <span style="color:var(--text-muted);font-size:0.8rem;">(${pct}%)</span>`
                        : `<span style="color:var(--text-muted);">N/A</span>`;

                    const gradeHtml = gradeInfo
                        ? `<span class="grade-pill" style="background:${gradeInfo.bg};color:${gradeInfo.color};">${gradeInfo.grade}</span>`
                        : `<span style="color:var(--text-muted);">-</span>`;

                    const timeStr = data.submittedAt || data.startedAt
                        ? (data.submittedAt && data.submittedAt.toDate ? new Date(data.submittedAt.toDate()).toLocaleString() : new Date(data.startedAt ? (data.startedAt.toDate ? data.startedAt.toDate() : data.startedAt) : Date.now()).toLocaleString())
                        : 'N/A';

                    html += `
                        <tr>
                            <td style="font-size:0.85rem;">${data.studentEmail || data.studentId || '-'}</td>
                            <td>${marksHtml}</td>
                            <td>${gradeHtml}</td>
                            <td style="color:var(--text-muted);font-size:0.82rem;">${timeStr}</td>
                            <td>
                                ${(() => {
                                    const vc = data.violationCount || 0;
                                    const vm = data.maxViolations || 0;
                                    const exceeded = data.autoSubmitted || (vm > 0 && vc >= vm);
                                    if (vc === 0 && !data.autoSubmitted) return `<span class="badge badge-clean">0/${vm || '-'} - clean</span>`;
                                    return `<span class="badge ${exceeded ? 'badge-flagged' : ''}" ${exceeded ? '' : 'style="background:#78350f;color:#fde68a;"'}>${vc}/${vm || '-'}${exceeded ? ' - limit reached' : ''}</span>`;
                                })()}
                            </td>
                            <td>
                                ${(data.autoSubmitted || ((data.violationCount || 0) > 0 && (data.maxViolations || 0) > 0 && data.violationCount >= data.maxViolations))
                                    ? `<button type="button" class="btn" style="background:#dc2626;color:white;font-size:0.78rem;border:none;cursor:pointer;padding:0.35rem 0.7rem;border-radius:6px;" onclick="expelStudent('${data.id}', '${(data.studentEmail || data.studentId || 'student').replace(/'/g, "\\'")}')">Expel</button>`
                                    : `<span style="color:var(--text-muted);font-size:0.8rem;">-</span>`}
                            </td>
                        </tr>
                    `;
                });

                tableBody.innerHTML = html;
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="6" style="color:#ef4444;">Error: ${err.message}</td></tr>`;
            }
        }

        auth.onAuthStateChanged((user) => {
            if (user) loadResults();
        });
    </script>
    <script type="module" src="../../js/nav.js"></script>

    <footer class="site-footer">&copy; 2026 Exatopia Team. All rights reserved.</footer>
</body>
</html>
