<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Exam | Exatopia</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        .q-card {
            background: var(--bg-inset);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            margin-top: 0.85rem;
            transition: border-color 0.2s;
        }
        .q-card:hover { border-color: var(--border-md); }
        .q-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; }
        .q-card-header strong { color: var(--brown-200); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.55rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <a href="../../index.html" class="logo" style="text-decoration:none;"><span class="logo-e">E</span>Xatopia</a>
        <button id="menuToggle" class="menu-toggle" aria-label="Menu">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="../../index.html">Home</a>
            <a href="../../pages/student/profile.html">Examinee Profile</a>
            <a href="../../pages/teacher/profile.html">Examiner Profile</a>
            <a href="../../pages/student/dashboard.html">Dashboard</a>
            <a href="../../pages/student/exams.html">Exams</a>
            <a href="../../pages/teacher/create-exam.html">Set Exam</a>
            <a href="../../pages/student/viva.html">Viva</a>
            <a href="../../pages/admin/dashboard.html">Dashboard</a>
            <a href="../../pages/login.html">Sign In</a>
            <a href="../../pages/register.html">Register</a>
            <button id="logoutBtn" class="btn" style="background:#dc2626; color:white; border:none; cursor:pointer; margin-left:1rem;">Logout</button>
        </div>
    </nav>

    <main style="padding: 2.25rem 1.75rem; max-width: 900px; width: 100%; margin: 0 auto;">
        <h2>Edit Exam</h2>
        <p id="loadStatus" style="color: var(--text-muted);">Loading exam...</p>

        <form id="editExamForm" style="display:none;">
            
            <div class="form-section">
                <h3>Exam Information</h3>
                <div class="form-group" style="margin-top: 1rem;">
                    <label>Exam Title</label>
                    <input type="text" id="title" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Duration (Minutes)</label>
                        <input type="number" id="duration" min="5" required>
                    </div>
                    <div class="form-group">
                        <label>Max Allowed Cheat Violations</label>
                        <input type="number" id="maxViolations" min="1" required>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="datetime-local" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="datetime-local" id="endTime" required>
                    </div>
                </div>
            </div>

            
            <div class="form-section">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>Questions</h3>
                    <button type="button" id="addQBtn" class="btn btn-primary" style="font-size: 0.875rem;">+ Add Question</button>
                </div>
                <div id="questionsList"></div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; cursor: pointer; font-size: 1rem;">💾 Save Changes</button>
            <p id="statusMsg" style="margin-top: 1rem; text-align: center;"></p>
        </form>
    </main>

    <script type="module">
        import { protectRoute } from "../../js/guard.js";
        import { auth } from "../../js/firebase-config.js";
        import { getExamById, updateExam } from "../../js/exam.js";

        protectRoute(["teacher"]);

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get("examId");

        let questionCount = 0;

        function addQuestionBlock(qData = null) {
            questionCount++;
            const qDiv = document.createElement("div");
            qDiv.className = "q-card";
            qDiv.id = `q_${questionCount}`;
            qDiv.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.5rem;">
                    <strong>Question ${questionCount}</strong>
                    <button type="button" class="btn" style="background:#dc2626; color:white; padding:0.25rem 0.6rem; font-size:0.75rem; border:none; border-radius:4px; cursor:pointer;" onclick="this.closest('.q-card').remove()">Remove</button>
                </div>
                <div class="form-group">
                    <input type="text" class="q-text" placeholder="Enter question text" value="${qData ? (qData.text || '').replace(/"/g, '&quot;') : ''}" required>
                </div>
                <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:0.5rem;" class="form-group">
                    <input type="text" class="q-opt1" placeholder="Option A" value="${qData && qData.options ? (qData.options[0] || '').replace(/"/g, '&quot;') : ''}" required>
                    <input type="text" class="q-opt2" placeholder="Option B" value="${qData && qData.options ? (qData.options[1] || '').replace(/"/g, '&quot;') : ''}" required>
                    <input type="text" class="q-opt3" placeholder="Option C" value="${qData && qData.options ? (qData.options[2] || '').replace(/"/g, '&quot;') : ''}" required>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem;" class="form-group">
                    <input type="text" class="q-opt4" placeholder="Option D" value="${qData && qData.options ? (qData.options[3] || '').replace(/"/g, '&quot;') : ''}" required>
                    <input type="text" class="q-ans" placeholder="Correct Answer (Exact Option Text)" value="${qData ? (qData.correctAnswer || '').replace(/"/g, '&quot;') : ''}" required>
                </div>
            `;
            document.getElementById("questionsList").appendChild(qDiv);
        }

        document.getElementById("addQBtn").addEventListener("click", () => addQuestionBlock());

        let examData = null;

        async function loadExam() {
            const loadStatus = document.getElementById("loadStatus");
            try {
                examData = await getExamById(examId);

                if (!examData) {
                    loadStatus.textContent = "Exam not found.";
                    return;
                }

                document.getElementById("title").value = examData.title || "";
                document.getElementById("duration").value = examData.duration || 30;
                document.getElementById("maxViolations").value = examData.maxViolations || 3;
                document.getElementById("startTime").value = examData.startTime || "";
                document.getElementById("endTime").value = examData.endTime || "";

                document.getElementById("questionsList").innerHTML = "";
                questionCount = 0;
                (examData.questions || []).forEach(q => addQuestionBlock(q));

                loadStatus.style.display = "none";
                document.getElementById("editExamForm").style.display = "block";
            } catch (err) {
                loadStatus.textContent = "Error loading exam: " + err.message;
            }
        }

        document.getElementById("editExamForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const statusMsg = document.getElementById("statusMsg");
            statusMsg.style.color = "white";
            statusMsg.textContent = "Saving changes...";

            const updated = {
                title: document.getElementById("title").value,
                duration: document.getElementById("duration").value,
                maxViolations: document.getElementById("maxViolations").value,
                startTime: document.getElementById("startTime").value,
                endTime: document.getElementById("endTime").value
            };

            const questions = [];
            document.querySelectorAll(".q-card").forEach(card => {
                questions.push({
                    text: card.querySelector(".q-text").value,
                    type: "mcq",
                    options: [
                        card.querySelector(".q-opt1").value,
                        card.querySelector(".q-opt2").value,
                        card.querySelector(".q-opt3").value,
                        card.querySelector(".q-opt4").value
                    ],
                    correctAnswer: card.querySelector(".q-ans").value,
                    marks: 1
                });
            });

            if (questions.length === 0) {
                statusMsg.style.color = "#ef4444";
                statusMsg.textContent = "Add at least one question before saving.";
                return;
            }

            try {
                await updateExam(examId, updated, questions);
                statusMsg.style.color = "#22c55e";
                statusMsg.textContent = "✓ Exam updated successfully! Redirecting...";
                setTimeout(() => window.location.href = "dashboard.html", 1500);
            } catch (err) {
                statusMsg.style.color = "#ef4444";
                statusMsg.textContent = "Error: " + err.message;
            }
        });

        auth.onAuthStateChanged((user) => {
            if (user) loadExam();
        });
    </script>
    <script type="module" src="../../js/nav.js"></script>

    <footer class="site-footer">&copy; 2026 Exatopia Team. All rights reserved.</footer>
</body>
</html>
