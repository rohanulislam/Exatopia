<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Exam Room | Exatopia</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        .exam-header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(90deg, var(--brown-900) 0%, var(--brown-800) 100%); padding: 1rem 2rem; border-bottom: 1px solid var(--border-md); position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow-sm); }
        .timer-badge { background: var(--bg-inset); border: 1px solid var(--border-md); color: var(--brown-200); font-weight: 800; padding: 0.45rem 1.1rem; border-radius: var(--radius-sm); font-variant-numeric: tabular-nums; }
        .q-container { max-width: 760px; margin: 2.25rem auto; padding: 0 1.25rem; }
        .q-card { background: var(--bg-card); border: 1px solid var(--border); padding: 2rem; border-radius: var(--radius-lg); margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); }
        .opt-group { display: flex; flex-direction: column; gap: 0.65rem; margin-top: 1.25rem; }
        .opt-label { display: flex; align-items: center; gap: 0.85rem; background: var(--bg-inset); padding: 0.85rem 1.1rem; border-radius: var(--radius-md); border: 1.5px solid var(--border); cursor: pointer; transition: background 0.18s, border-color 0.18s; color: var(--text-main); font-size: 0.95rem; }
        .opt-label:hover { background: var(--bg-hover); border-color: var(--border-md); }
        .explanation-box { background: rgba(21,128,61,0.15); border: 1px solid rgba(52,211,153,0.3); color: #a7f3d0; padding: 1rem 1.25rem; border-radius: var(--radius-md); margin-top: 1rem; font-size: 0.9rem; display: none; line-height: 1.55; }
        .score-banner { background: linear-gradient(145deg, var(--bg-card) 0%, rgba(30,16,8,0.95) 100%); border: 1px solid var(--border-md); border-radius: var(--radius-xl); padding: 2.25rem; text-align: center; margin-bottom: 2rem; display: none; box-shadow: var(--shadow-md); }
    </style>
</head>
<body>
    <div class="exam-header">
        <div>
            <h3 style="margin: 0;">Practice Exam</h3>
            <span style="font-size: 0.85rem; color: var(--text-muted);">Self-Assessment Mode</span>
        </div>
        <div id="timerDisplay" class="timer-badge">--:--</div>
    </div>

    <main class="q-container">
        
        <div id="scoreBanner" class="score-banner">
            <h2 id="scoreTitle" style="color: #22c55e; margin-bottom: 0.5rem;">Practice Score: 0 / 0</h2>
            <p style="color: var(--text-muted); margin: 0;">Review your detailed answer breakdown and explanations below.</p>
        </div>

        <form id="mockSubmissionForm">
            <div id="questionsList"></div>
            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem; cursor: pointer; margin-bottom: 3rem;">
                Submit Practice Exam
            </button>
        </form>
    </main>

    <script type="module">
        import { protectRoute } from "../../js/guard.js";
        import { getMockExam, saveMockResult } from "../../js/exam.js";
        protectRoute(["student"]);

        const urlParams = new URLSearchParams(window.location.search);
        let mockId = urlParams.get("mockId");
        let questions = [];
        let timeLimitMins = 10;
        let timerInterval = null;
        let mockTitle = "Practice Exam";

        async function initMockRoom() {
            const rawData = sessionStorage.getItem("mock_exam_data");
            let sessionMatched = false;
            if (rawData) {
                try {
                    const session = JSON.parse(rawData);
                    if (!mockId || session.mockId === mockId) {
                        questions = session.questions || [];
                        timeLimitMins = parseInt(session.timeLimit || 10);
                        if (session.title) mockTitle = session.title;
                        else if (questions.length) mockTitle = `Practice Exam (${questions.length} Questions)`;
                        if (!mockId && session.mockId) mockId = session.mockId;
                        sessionMatched = true;
                    }
                } catch (e) {}
            }

            if (!sessionMatched && mockId) {
                try {
                    const mockData = await getMockExam(mockId);
                    if (mockData && mockData.questions) {
                        questions = mockData.questions;
                        timeLimitMins = parseInt(mockData.timeLimit || 10);
                        if (mockData.title) mockTitle = mockData.title;
                    }
                } catch (e) {
                    console.warn("Could not load practice exam:", e);
                }
            }

            if (!questions || questions.length === 0) {
                alert("No practice exam session found. Redirecting to generator...");
                window.location.href = "mock-exam.html";
                return;
            }

            renderQuestions();
            startTimer();
        }

        
        function renderQuestions() {
            const container = document.getElementById("questionsList");
            container.innerHTML = "";
            questions.forEach((q, idx) => {
                const qDiv = document.createElement("div");
                qDiv.className = "q-card";
                qDiv.id = `q_card_${idx}`;
                
                let optionsHtml = "";
                q.options.forEach((opt, oIdx) => {
                    optionsHtml += `
                        <label class="opt-label" id="label_${idx}_${oIdx}">
                            <input type="radio" name="q_${idx}" value="${opt.replace(/"/g, '&quot;')}" required>
                            <span>${opt}</span>
                        </label>
                    `;
                });

                qDiv.innerHTML = `
                    <strong style="color: #a5b4fc;">Question ${idx + 1}</strong>
                    <p style="margin-top: 0.5rem; font-size: 1.05rem;">${q.text}</p>
                    <div class="opt-group">${optionsHtml}</div>
                    <div class="explanation-box" id="exp_${idx}">
                        <strong>Explanation:</strong> ${q.explanation || 'No explanation provided.'}
                    </div>
                `;
                container.appendChild(qDiv);
            });
        }

        
        function startTimer() {
            if (timeLimitMins > 0) {
                let totalSeconds = timeLimitMins * 60;
                const timerDisplay = document.getElementById("timerDisplay");

                timerInterval = setInterval(() => {
                    const mins = Math.floor(totalSeconds / 60);
                    const secs = totalSeconds % 60;
                    timerDisplay.textContent = `Time Remaining: ${mins}:${secs < 10 ? '0' : ''}${secs}`;

                    if (totalSeconds <= 0) {
                        clearInterval(timerInterval);
                        alert("Time's up! Automatically submitting your practice exam.");
                        gradeExam();
                    }
                    totalSeconds--;
                }, 1000);
            } else {
                document.getElementById("timerDisplay").textContent = "Untimed Mode";
            }
        }

        
        document.getElementById("mockSubmissionForm").addEventListener("submit", (e) => {
            e.preventDefault();
            gradeExam();
        });

        let isGraded = false;
        async function gradeExam() {
            if (isGraded) return;
            isGraded = true;
            if (timerInterval) clearInterval(timerInterval);

            let score = 0;
            const userAnswers = {};

            questions.forEach((q, idx) => {
                const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
                const userAns = selected ? selected.value : null;
                userAnswers[idx] = userAns;

                
                document.querySelectorAll(`input[name="q_${idx}"]`).forEach(inp => inp.disabled = true);

                
                q.options.forEach((opt, oIdx) => {
                    const label = document.getElementById(`label_${idx}_${oIdx}`);
                    if (opt === q.correctAnswer) {
                        label.style.background = "#064e3b";
                        label.style.borderColor = "#10b981";
                    } else if (userAns === opt && userAns !== q.correctAnswer) {
                        label.style.background = "#7f1d1d";
                        label.style.borderColor = "#ef4444";
                    }
                });

                if (userAns === q.correctAnswer) {
                    score++;
                }

                
                document.getElementById(`exp_${idx}`).style.display = "block";
            });

            
            try {
                await saveMockResult(mockId, {
                    title: mockTitle,
                    score: score,
                    total: questions.length,
                    answers: userAnswers
                });
            } catch (saveErr) {
                console.warn("Could not save practice result to database:", saveErr);
            }

            
            document.getElementById("scoreTitle").textContent = `Practice Score: ${score} / ${questions.length}`;
            document.getElementById("scoreBanner").style.display = "block";
            
            
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.textContent = "Return to Dashboard";
            submitBtn.style.background = "var(--bg-inset)";
            submitBtn.style.border = "1px solid var(--border-md)";
            submitBtn.onclick = () => window.location.href = "dashboard.html";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        initMockRoom();
    </script>
    <script type="module" src="../../js/nav.js"></script>

    <footer class="site-footer">&copy; 2026 Exatopia Team. All rights reserved.</footer>
</body>
</html>
