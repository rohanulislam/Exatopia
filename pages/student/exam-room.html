<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Room | Exatopia</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
        body { background: var(--bg-page); }

        
        .q-progress {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .q-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--border-md);
            transition: background 0.2s;
        }
        .q-dot.answered { background: var(--accent); }
        .q-dot.current  { background: var(--brown-200); }
    </style>
</head>
<body>
    
    <div id="startModal" class="start-modal">
        <div style="max-width:500px; text-align:center;">
            <div style="font-size:3rem; margin-bottom:1.25rem;">🔒</div>
            <h2 style="margin-bottom:0.85rem;">Secure Proctoring Required</h2>
            <p style="color:var(--text-muted); line-height:1.7; margin-bottom:2rem;">
                This exam is monitored for tab switches, fullscreen exit, and unauthorized keyboard shortcuts.
                Click below to enter fullscreen mode and begin.
            </p>
            <button id="startExamBtn" class="btn btn-primary" style="padding:0.9rem 2.5rem; font-size:1.05rem; cursor:pointer;">
                Enter Fullscreen &amp; Start Exam
            </button>
            <p id="startCountdownLabel" style="color:var(--brown-300); font-size:1rem; margin-top:1rem; font-weight:600;"></p>
        </div>
    </div>

    
    <div class="exam-header">
        <div>
            <h2 id="examTitle" style="font-size:1.1rem; margin:0; color:var(--text-heading);">Loading Exam…</h2>
            <p style="color:var(--text-muted); font-size:0.78rem; margin-top:0.1rem;">Exatopia Exam Room</p>
        </div>
        <div class="timer-box" id="timer">--:--</div>
    </div>

    <main style="padding: 1.75rem; max-width: 720px; margin: 0 auto;">
        <div id="warningBox" class="warning-box"></div>

        <div class="q-progress" id="qProgress"></div>
        <div id="questionsContainer"></div>

        <div style="margin-top: 1.75rem; display: flex; justify-content: flex-end; gap: 0.75rem;">
            <button id="nextBtn"   class="btn btn-secondary" style="display:none; cursor:pointer;">Next →</button>
            <button id="submitBtn" class="btn btn-success"   style="display:none; cursor:pointer;">✓ Submit Exam</button>
        </div>
    </main>

    <script type="module">
        import { protectRoute } from "../../js/guard.js";
        import { auth, db }    from "../../js/firebase-config.js";
        import { doc, getDoc, collection, getDocs, addDoc, updateDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { CheatDetector } from "../../js/cheat-detector.js";

        protectRoute(["student"]);

        const urlParams     = new URLSearchParams(window.location.search);
        const examId        = urlParams.get("examId");
        const providedCode  = (urlParams.get("code") || "").trim().toUpperCase();

        if (!examId) { alert("No exam ID provided."); window.location.href = "dashboard.html"; }

        let startMs = null, endMs = null, startCountdownInterval = null;
        let questions = [], currentIndex = 0, selectedAnswers = {};
        let timeRemaining = 0, timerInterval = null, cheatDetector = null;
        let attemptRefId = null, maxAllowedViolations = 3;
        let currentExamTitle = "";

        async function initExam() {
            try {
                const examDoc = await getDoc(doc(db, "exams", examId));
                if (!examDoc.exists()) { alert("Exam not found."); window.location.href = "dashboard.html"; return; }
                const examData = examDoc.data();
                currentExamTitle = examData.title || "Formal Exam";
                document.getElementById("examTitle").textContent = currentExamTitle;
                maxAllowedViolations = parseInt(examData.maxViolations || 3);
                timeRemaining = parseInt(examData.duration) * 60;

                if (examData.code) {
                    if (!providedCode) { alert("An exam code is required. Please join using the code from your teacher."); window.location.href = "dashboard.html"; return; }
                    if (String(examData.code).toUpperCase() !== providedCode) { alert("Invalid exam code."); window.location.href = "dashboard.html"; return; }
                }

                const currentUser = auth.currentUser;
                if (currentUser && examData.teacherId === currentUser.uid) {
                    document.getElementById("startModal").style.display = "none";
                    document.getElementById("timer").textContent = "—";
                    document.getElementById("questionsContainer").innerHTML = `<div class="empty-state"><div class="icon">🚫</div>You cannot take your own exam.</div>`;
                    return;
                }

                try {
                    const user = auth.currentUser;
                    if (user) {
                        const aq = query(collection(db, "attempts"), where("studentId", "==", user.uid), where("examId", "==", examId));
                        const aqSnap = await getDocs(aq);
                        const alreadyTaken = aqSnap.docs.some(d => !!d.data().submittedAt);
                        if (alreadyTaken) {
                            document.getElementById("startModal").style.display = "none";
                            document.getElementById("timer").textContent = "—";
                            document.getElementById("questionsContainer").innerHTML = `<div class="empty-state" style="margin-top:2rem;"><div class="icon">✅</div>You have already completed this exam. Each exam can only be taken once.</div>`;
                            return;
                        }
                    }
                } catch (attErr) { console.warn("Attempt check skipped:", attErr.message); }

                startMs = examData.startTime ? new Date(examData.startTime).getTime() : null;
                endMs   = examData.endTime   ? new Date(examData.endTime).getTime()   : null;
                enforceExamWindow();

                try {
                    const qSnapshot = await getDocs(collection(db, `exams/${examId}/questions`));
                    qSnapshot.forEach((doc) => { questions.push({ id: doc.id, ...doc.data() }); });
                } catch (subErr) { console.warn("Questions subcollection read skipped:", subErr.message); }

                if (questions.length === 0 && Array.isArray(examData.questions) && examData.questions.length > 0) {
                    examData.questions.forEach((q, idx) => { questions.push({ id: q.id || `q_${idx + 1}`, ...q }); });
                }

                if (questions.length === 0) { document.getElementById("questionsContainer").innerHTML = "<p>No questions found in this exam.</p>"; return; }

                
                const dots = document.getElementById("qProgress");
                questions.forEach((_, i) => {
                    const d = document.createElement("div");
                    d.className = "q-dot" + (i === 0 ? " current" : "");
                    d.id = `dot_${i}`;
                    dots.appendChild(d);
                });
            } catch (err) { alert("Error initializing exam: " + err.message); }
        }

        function enforceExamWindow() {
            const timerDisplay  = document.getElementById("timer");
            const startBtn      = document.getElementById("startExamBtn");
            const countdownLabel = document.getElementById("startCountdownLabel");

            const tick = () => {
                const now = Date.now();
                if (startMs && now < startMs) {
                    const remaining = Math.floor((startMs - now) / 1000);
                    const text = `Starts in ${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;
                    timerDisplay.textContent = text;
                    if (countdownLabel) countdownLabel.textContent = `⏱ ${text}`;
                    startBtn.disabled = true; startBtn.style.opacity = "0.5"; startBtn.style.cursor = "not-allowed";
                    startBtn.textContent = "Exam not started yet"; return;
                }
                if (endMs && now > endMs) {
                    clearInterval(startCountdownInterval);
                    timerDisplay.textContent = "Ended";
                    if (countdownLabel) countdownLabel.textContent = "⛔ This exam has ended.";
                    startBtn.disabled = true; startBtn.style.opacity = "0.5"; startBtn.textContent = "Exam has ended"; return;
                }
                clearInterval(startCountdownInterval);
                timerDisplay.textContent = "--:--";
                if (countdownLabel) countdownLabel.textContent = "";
                startBtn.disabled = false; startBtn.style.opacity = "1"; startBtn.style.cursor = "pointer";
                startBtn.textContent = "Enter Fullscreen & Start Exam";
            };
            tick();
            if (startCountdownInterval) clearInterval(startCountdownInterval);
            startCountdownInterval = setInterval(tick, 1000);
        }

        document.getElementById("startExamBtn").addEventListener("click", async () => {
            const now = Date.now();
            if (startMs && now < startMs) { alert("This exam has not started yet."); return; }
            if (endMs   && now > endMs)   { alert("This exam has already ended."); return; }

            try { await CheatDetector.requestFullscreen(); } catch (e) { console.warn("Fullscreen denied."); }
            if (startCountdownInterval) clearInterval(startCountdownInterval);
            document.getElementById("startModal").style.display = "none";

            const user = auth.currentUser;
            const attemptDoc = await addDoc(collection(db, "attempts"), {
                examId, examTitle: currentExamTitle,
                studentId: user.uid, studentEmail: user.email || "",
                answers: {}, startedAt: serverTimestamp(), submittedAt: null,
                autoSubmitted: false, violationCount: 0, maxViolations: maxAllowedViolations
            });
            attemptRefId = attemptDoc.id;

            if (endMs) {
                const secondsLeft = Math.max(0, Math.floor((endMs - Date.now()) / 1000));
                timeRemaining = Math.min(timeRemaining, secondsLeft);
            }

            cheatDetector = new CheatDetector({ maxViolations: maxAllowedViolations, onViolation: handleViolation });
            cheatDetector.start();
            startTimer();
            renderQuestion();
        });

        async function handleViolation(v) {
            const warningBox = document.getElementById("warningBox");
            warningBox.style.display = "block";
            warningBox.textContent = `WARNING (${v.count}/${v.max}): ${v.description}`;
            if (attemptRefId) {
                await addDoc(collection(db, `attempts/${attemptRefId}/violations`), { type: v.type, description: v.description, timestamp: serverTimestamp() });
            }
            if (v.count >= v.max) { alert(`Maximum violations reached (${v.max}). Auto-submitting.`); submitExam(true); }
        }

        function startTimer() {
            const timerDisplay = document.getElementById("timer");
            timerInterval = setInterval(() => {
                timeRemaining--;
                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                timerDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
                if (timeRemaining <= 60) timerDisplay.className = "timer-box warning";
                if (timeRemaining <= 0) { clearInterval(timerInterval); alert("Time expired! Submitting automatically."); submitExam(true); }
            }, 1000);
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            const container = document.getElementById("questionsContainer");

            
            questions.forEach((_, i) => {
                const d = document.getElementById(`dot_${i}`);
                if (!d) return;
                d.className = "q-dot";
                if (selectedAnswers[questions[i].id]) d.classList.add("answered");
                if (i === currentIndex) d.classList.add("current");
            });

            let optionsHTML = "";
            if (q.options && q.options.length > 0) {
                const alreadyAnswered = !!selectedAnswers[q.id];
                optionsHTML = q.options.map(opt => `
                    <label class="option-item">
                        <input type="radio" name="q_${q.id}" value="${opt}" ${selectedAnswers[q.id] === opt ? 'checked' : ''} ${alreadyAnswered ? 'disabled' : ''}>
                        <span>${opt}</span>
                    </label>
                `).join('');
            }

            container.innerHTML = `
                <div class="q-card">
                    <p class="q-number">Question ${currentIndex + 1} of ${questions.length}</p>
                    <h3 class="q-text">${q.text}</h3>
                    <div style="margin-top:1.25rem;">${optionsHTML}</div>
                </div>
            `;

            container.querySelectorAll(`input[name="q_${q.id}"]`).forEach(radio => {
                radio.addEventListener("change", (e) => {
                    selectedAnswers[q.id] = e.target.value;
                    container.querySelectorAll(`input[name="q_${q.id}"]`).forEach(r => { r.disabled = true; });
                    const dot = document.getElementById(`dot_${currentIndex}`);
                    if (dot) { dot.classList.remove("current"); dot.classList.add("answered"); }
                });
            });

            document.getElementById("nextBtn").style.display   = currentIndex < questions.length - 1 ? "inline-flex" : "none";
            document.getElementById("submitBtn").style.display = currentIndex === questions.length - 1 ? "inline-flex" : "none";
        }

        document.getElementById("nextBtn").addEventListener("click", () => {
            if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); }
        });

        let isSubmitting = false;
        async function submitExam(autoSubmitted = false) {
            if (isSubmitting) return;
            isSubmitting = true;
            clearInterval(timerInterval);
            if (cheatDetector) cheatDetector.stop();

            const user           = auth.currentUser;
            const token          = user ? await user.getIdToken() : null;
            const violationCount = cheatDetector ? cheatDetector.violationCount : 0;
            let score = 0, total = questions.length, backendScored = false;

            try {
                if (token) {
                    const res = await fetch("../../api/submit-exam.php", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                        body: JSON.stringify({ examId, answers: selectedAnswers, autoSubmitted, violationCount })
                    });
                    const ct = res.headers.get("content-type") || "";
                    if (ct.includes("json")) {
                        const data = await res.json();
                        if (data && data.status === "success" && data.score !== undefined) { score = data.score; backendScored = true; }
                    }
                }
            } catch (err) { console.warn("Backend error:", err); }

            if (!backendScored) {
                score = 0;
                questions.forEach(q => { if (q.correctAnswer && selectedAnswers[q.id] === q.correctAnswer) score++; });
            }

            if (attemptRefId) {
                try {
                    await updateDoc(doc(db, "attempts", attemptRefId), {
                        examTitle: currentExamTitle, answers: selectedAnswers,
                        submittedAt: serverTimestamp(), autoSubmitted, violationCount,
                        maxViolations: maxAllowedViolations, score, total,
                        percentage: total > 0 ? Math.round((score / total) * 100) : 0
                    });
                } catch (dbErr) { console.warn("Could not update attempt:", dbErr); }
            }

            window.location.href = `result.html?examId=${examId}&score=${score}&total=${total}&auto=${autoSubmitted}`;
        }

        document.getElementById("submitBtn").addEventListener("click", () => submitExam(false));
        auth.onAuthStateChanged((user) => { if (user) initExam(); });
    </script>
    <script type="module" src="../../js/nav.js"></script>

    <footer class="site-footer">&copy; 2026 Exatopia Team. All rights reserved.</footer>
</body>
</html>
